<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cobalt Web Companion</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <!-- Header Bar -->
  <header class="top-bar">
    <div class="brand">
      <svg viewBox="0 0 24 24">
        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14H9v-2h2v2zm0-4H9V7h2v5zm4 4h-2v-6h2v6zm0-8h-2V7h2v1z"/>
      </svg>
      <span>Cobalt</span>
    </div>

    <div class="search-box">
      <svg viewBox="0 0 24 24">
        <path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
      </svg>
      <input type="text" id="search-input" aria-label="Search saved items" placeholder="Search your knowledge base...">
    </div>

    <div class="header-actions">
      <div class="status-pill">
        <div class="status-dot"></div>
        <span id="connection-status" role="status">Connecting…</span>
      </div>
      <button class="btn-icon" id="logout-btn" title="Lock & Disconnect">
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- Main Split Layout -->
  <main class="main-content">
    <!-- Left Pane: Notes Cards List -->
    <section class="notes-pane">
      <div class="filter-bar">
        <button class="filter-chip active" data-type="">All Items</button>
        <button class="filter-chip" data-type="TEXT">Notes</button>
        <button class="filter-chip" data-type="CODE">Code</button>
        <button class="filter-chip" data-type="LINK">Links</button>
        <button class="filter-chip" data-type="MEDIA">Movies & Shows</button>
        <button class="filter-chip" data-type="ATTACHMENT">Attachments</button>
      </div>

      <div class="notes-list" id="notes-list">
        <!-- Injected dynamically by app.js -->
      </div>

      <div class="pagination-bar">
        <button class="pagination-btn" id="prev-page-btn" disabled>&larr; Prev</button>
        <span id="page-indicator">Page 1 of 1</span>
        <button class="pagination-btn" id="next-page-btn" disabled>Next &rarr;</button>
      </div>
    </section>

    <!-- Right Pane: Markdown Reader -->
    <section class="reader-pane" id="reader-pane">
      <div class="empty-state" id="empty-state">
        <svg viewBox="0 0 24 24">
          <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-5 14H7v-2h7v2zm3-4H7v-2h10v2zm0-4H7V7h10v2z"/>
        </svg>
        <p>Select a note from the left to read its full content</p>
      </div>

      <div id="reader-content" style="display: none;">
        <div class="reader-header">
          <div class="note-card-title">
            <h1 class="reader-title" id="reader-title">Untitled Note</h1>
            <div class="reader-actions">
              <button class="pagination-btn" id="back-notes-btn">← Back to items</button>
              <button class="pagination-btn" id="edit-note-btn" disabled>Edit Note</button>
              <button class="pagination-btn" id="copy-note-btn">Copy Text</button>
            </div>
          </div>
          <div class="reader-meta-row">
            <span id="reader-date" style="font-size: 13px; opacity: 0.65;"></span>
            <div class="reader-tags" id="reader-tags"></div>
          </div>
          <div class="mobile-lock-alert" id="mobile-lock-alert" style="display: none;"></div>
        </div>
        <form id="note-editor" hidden>
          <label for="edit-title">Title</label>
          <input id="edit-title" maxlength="512" autocomplete="off">
          <label for="edit-body">Note text · Markdown</label>
          <textarea id="edit-body" spellcheck="false"></textarea>
          <div class="editor-footer">
            <span id="edit-message" role="status" aria-live="polite">Changes stay here until you save.</span>
            <button type="button" class="pagination-btn" id="cancel-edit-btn">Cancel</button>
            <button type="submit" class="btn-primary" id="save-note-btn">Save Changes</button>
          </div>
        </form>
        <article class="reader-body" id="reader-body">
          <!-- Formatted Markdown content rendered here -->
        </article>
      </div>
    </section>
  </main>

  <!-- 4-Digit PIN Security Modal -->
  <div class="modal-overlay" id="auth-modal" style="display: flex;">
    <div class="modal-card">
      <div class="modal-icon">
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/>
        </svg>
      </div>
      <h2 style="font-size: 18px; margin-bottom: 6px;">Cobalt Web Companion</h2>
      <p style="font-size: 13px; opacity: 0.7; margin-bottom: 20px;">
        Enter the 4-digit PIN generated on your Android device to unlock your notes.
      </p>
      <input type="password" id="pin-input" aria-label="Four-digit PIN" inputmode="numeric" class="pin-input" maxlength="4" placeholder="••••" autocomplete="off" autofocus>
      <button class="btn-primary" id="login-btn">Connect & Unlock</button>
      <div class="modal-error" id="modal-error"></div>
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
