name: Build Release
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: cobalt-release
  cancel-in-progress: false

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
      version_name: ${{ steps.check.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check official release state
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(python3 -c 'import sys; sys.path.insert(0,"scripts/release"); from assets import app_version; print(app_version()[0])')
          echo "version_name=$VERSION" >> "$GITHUB_OUTPUT"
          export VERSION
          gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" > "$RUNNER_TEMP/release-pages.json"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          pages = json.loads((Path(os.environ['RUNNER_TEMP'])/'release-pages.json').read_text())
          matching = [release for page in pages for release in page if release['tag_name'] == 'v' + os.environ['VERSION']]
          if len(matching) > 1:
              raise SystemExit('Multiple releases use this version tag; resolve the ambiguity before publishing.')
          release = matching[0] if matching else None
          if release and release['draft'] and release['target_commitish'] != os.environ['GITHUB_SHA']:
              raise SystemExit('Existing draft belongs to another source revision; resolve it before publishing.')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('should_build=' + ('true' if release is None or release['draft'] else 'false') + '\n')
          PY

  build:
    needs: check-version
    if: needs.check-version.outputs.should_build == 'true'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.check-version.outputs.version_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
          validate-wrappers: false
      - name: Check release publication rules
        run: python3 -m unittest discover -s scripts/release -p 'test_*.py' -v
      - name: Verify signing configuration
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          required = ['KEYSTORE_BASE64', 'KEYSTORE_PASSWORD', 'KEY_ALIAS', 'KEY_PASSWORD']
          missing = [key for key in required if not os.environ.get(key)]
          if missing:
              raise SystemExit('Missing release secrets: ' + ', '.join(missing))
          PY
          printf '%s' "$KEYSTORE_BASE64" | base64 -di > app/release-key.jks
      - name: Prepare exact release notes
        run: python3 scripts/release/assets.py notes --version "$VERSION" --output "$RUNNER_TEMP/release-notes.md"
      - name: Build release APK
        env:
          KEYSTORE_PATH: "release-key.jks"
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --parallel --build-cache
      - name: Name and verify the signed APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk "app/build/outputs/apk/release/cobalt-v$VERSION.apk"
          python3 scripts/release/assets.py verify-apk --apk "app/build/outputs/apk/release/cobalt-v$VERSION.apk"
      - name: Retain APK, checksum and R8 mapping
        uses: actions/upload-artifact@v4
        with:
          name: cobalt-release
          path: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/release/*.sha256
            app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: error
          retention-days: 90
      - name: Upload to a draft release
        id: upload_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Cobalt v${{ env.VERSION }}
          body_path: ${{ runner.temp }}/release-notes.md
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/cobalt-v${{ env.VERSION }}.apk
            app/build/outputs/apk/release/cobalt-v${{ env.VERSION }}.apk.sha256
      - name: Confirm uploaded identity and bytes
        env:
          RELEASE_ID: ${{ steps.upload_release.outputs.id }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/uploaded-release.json"
          python3 scripts/release/assets.py confirm-upload --allow-draft --release-json "$RUNNER_TEMP/uploaded-release.json" --apk "app/build/outputs/apk/release/cobalt-v$VERSION.apk"
          ASSET_ID=$(python3 -c 'import json,os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"uploaded-release.json").read_text()); print(next(a["id"] for a in r["assets"] if a["name"]=="cobalt-v"+os.environ["VERSION"]+".apk"))')
          gh api "repos/$GITHUB_REPOSITORY/releases/assets/$ASSET_ID" -H 'Accept: application/octet-stream' > "$RUNNER_TEMP/uploaded.apk"
          cmp "app/build/outputs/apk/release/cobalt-v$VERSION.apk" "$RUNNER_TEMP/uploaded.apk"
      - name: Publish complete release
        env:
          RELEASE_ID: ${{ steps.upload_release.outputs.id }}
        run: |
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false -f make_latest=true > "$RUNNER_TEMP/publication-result.json"
          gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" > "$RUNNER_TEMP/published-release.json"
          python3 scripts/release/assets.py confirm-upload --release-json "$RUNNER_TEMP/published-release.json" --apk "app/build/outputs/apk/release/cobalt-v$VERSION.apk"
