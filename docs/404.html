<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Cobalt</title>
  <meta name="description" content="The requested page could not be found.">
  <meta name="theme-color" content="#FF6F1E">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <header class="site-header">
    <div class="header-container">
      <a href="./" class="brand-link">
        <img src="./favicon.svg" alt="Cobalt Logo" class="brand-icon">
        <span>Cobalt</span>
      </a>
      <nav class="site-nav" aria-label="Main Navigation">
        <a href="./">Home</a>
        <a href="./privacy.html">Privacy</a>
        <a href="./terms.html">Terms</a>
        <button id="theme-toggle" class="theme-toggle-btn" aria-label="Toggle dark/light theme" title="Toggle theme">◐</button>
      </nav>
    </div>
  </header>

  <main id="main-content">
    <div class="container">
      <div class="callback-card">
        <div class="callback-icon" style="background: rgba(255, 111, 30, 0.15); color: var(--primary);" aria-hidden="true">404</div>
        <h1>Page Not Found</h1>
        <p>
          The page or document you requested does not exist or has moved.
        </p>

        <div style="display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; margin-top: 24px;">
          <a href="./" class="btn btn-primary">Return Home</a>
          <a href="./privacy.html" class="btn btn-secondary">Privacy Policy</a>
          <a href="./terms.html" class="btn btn-secondary">Terms &amp; Conditions</a>
        </div>
      </div>
    </div>
  </main>

  <footer class="site-footer">
    <div class="footer-container">
      <nav class="footer-nav" aria-label="Footer Navigation">
        <a href="./">Home</a>
        <a href="./privacy.html">Privacy Policy</a>
        <a href="./terms.html">Terms &amp; Conditions</a>
        <a href="https://github.com/hanan-bhatti/cobalt" target="_blank" rel="noopener noreferrer">Source Code</a>
      </nav>
      <p class="footer-copy">
        &copy; 2026 Hanan Bhatti. Licensed under AGPL-3.0-or-later.
      </p>
    </div>
  </footer>

  <script>
    (function() {
      const toggleBtn = document.getElementById('theme-toggle');
      const savedTheme = localStorage.getItem('cobalt-theme');
      if (savedTheme) {
        document.documentElement.setAttribute('data-theme', savedTheme);
      }
      toggleBtn.addEventListener('click', function() {
        const current = document.documentElement.getAttribute('data-theme') ||
          (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        const next = current === 'dark' ? 'light' : 'dark';
        document.documentElement.setAttribute('data-theme', next);
        localStorage.setItem('cobalt-theme', next);
      });
    })();
  </script>
</body>
</html>
