<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 220" width="320" height="220" fill="none">
  <!-- Definitions for clean drop shadows -->
  <defs>
    <filter id="card-shadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.06"/>
    </filter>
    <filter id="tile-shadow" x="-20%" y="-20%" width="140%" height="150%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.16"/>
    </filter>
  </defs>

  <!-- Organic Background Cloud / Blob (Understated, soft) -->
  <path d="M 60,55 C 110,25 210,22 260,50 C 300,72 312,120 285,155 C 260,185 190,190 135,180 C 70,170 20,150 15,108 C 12,68 32,62 60,55 Z"
        fill="currentColor" fill-opacity="0.10" />

  <!-- Sparkle Accent: Top-Right (Small & understated) -->
  <path d="M 270,48 C 270,52 273,55 277,55 C 273,55 270,58 270,62 C 270,58 267,55 263,55 C 267,55 270,52 270,48 Z"
        stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.55"/>

  <!-- Sparkle Accent: Lower-Left (Small & understated) -->
  <path d="M 46,150 C 46,153 48,155 51,155 C 48,155 46,157 46,160 C 46,157 44,155 41,155 C 44,155 46,153 46,150 Z"
        stroke="currentColor" stroke-width="1.0" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.30"/>

