    </g>
  </g>

  <!-- Right Card: Official Text / Notes Icon (ic_custom_text) -->
  <g transform="translate(204, 62) rotate(12)" filter="url(#card-shadow)">
    <rect width="64" height="74" rx="16" fill="#FFFFFF" stroke="#E4DAD0" stroke-width="1.0"/>
    <g transform="translate(18, 23) scale(1.15)" fill="#52443D">
