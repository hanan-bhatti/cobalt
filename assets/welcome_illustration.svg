      <path d="M12 17.75H7C6.59 17.75 6.25 17.41 6.25 17C6.25 16.59 6.59 16.25 7 16.25H12C12.41 16.25 12.75 16.59 12.75 17C12.75 17.41 12.41 17.75 12 17.75Z"/>
      <path d="M17 17.75H15C14.59 17.75 14.25 17.41 14.25 17C14.25 16.59 14.59 16.25 15 16.25H17C17.41 16.25 17.75 16.59 17.75 17C17.75 17.41 17.41 17.75 17 17.75Z"/>
    </g>
  </g>

  <!-- Center Foreground Tile: Visually Dominant Cobalt Logo (72% Container Width) -->
  <g transform="translate(122, 78)" filter="url(#tile-shadow)">
    <rect width="76" height="76" rx="22" fill="#3E4E68" />

    <!-- Official Cobalt Monogram ("27 Co") - Scaled to ~72% container width -->
    <g transform="translate(10, 10) scale(1.12)">
      <!-- "2" - Atomic number top-left -->
      <path fill="#FFFFFF" d="M1,2 h6 v2 h-6 z M1,6 h6 v2 h-6 z M1,10 h6 v2 h-6 z M5,4 h2 v2 h-2 z M1,8 h2 v2 h-2 z"/>
      <!-- "7" - Atomic number top-left -->
      <path fill="#FFFFFF" d="M9,2 h6 v2 h-6 z M13,4 h2 v8 h-2 z"/>
      <!-- "C" - Left side -->
      <path fill="#FFFFFF" d="M23,16 H1 V48 H23 V40 H9 V24 H23 Z"/>
      <!-- "o" - Right side -->
      <path fill="#FFFFFF" fill-rule="evenodd" d="M29,24 H49 V48 H29 Z M37,32 H41 V40 H37 Z"/>
    </g>
  </g>
</svg>
