      <path d="M12 7.75H7C6.59 7.75 6.25 7.41 6.25 7C6.25 6.59 6.59 6.25 7 6.25H12C12.41 6.25 12.75 6.59 12.75 7C12.75 7.41 12.41 7.75 12 7.75Z"/>
