  <div class="c-heading">

  <p class="c-a11y" data-announcement role="status" aria-live="polite"></p>
  <script>
    (() => {
      const root = document.getElementById('cobalt-folder-themes-1113');
      if (!root) return;

      // Light and current-dark values are the app's 20 presets. The current
      // conversion was extracted using AndroidX float32 HSL arithmetic.
      // Proposed accents are individually tuned in OKLCH, then gamut mapped.
      const colors = [
        ['coral-rose', 'Coral Rose', '#FF6B6B', '#E98181', '#FD938F'],
        ['peach-sun', 'Peach Sun', '#FF8E53', '#E5966D', '#FEA77C'],
        ['soft-gold', 'Soft Gold', '#FFA800', '#E0B052', '#FFB54D'],
        ['emerald-sage', 'Emerald Sage', '#4CAF50', '#71C174', '#81C980'],
        ['minty-teal', 'Minty Teal', '#00BFA5', '#52E0CD', '#5AD4BC'],
        ['ice-blue', 'Ice Blue', '#29B6F6', '#52B4E0', '#67C5F8'],
        ['royal-indigo', 'Royal Indigo', '#5C6BC0', '#6C79C6', '#98AAFC'],
        ['lavender-dream', 'Lavender Dream', '#BA68C8', '#BB69C9', '#DC99E7'],
        ['crimson-berry', 'Crimson Berry', '#D81B60', '#E05286', '#FE839E'],
        ['slate-silver', 'Slate Silver', '#78909C', '#75A5BD', '#9AB2BF'],
        ['flamingo-pink', 'Flamingo Pink', '#F06292', '#E56D95', '#FF99B6'],
        ['terra-cotta', 'Terra Cotta', '#FF8A65', '#E8967C', '#FDA68A'],
        ['golden-silk', 'Golden Silk', '#FFD54F', '#E5C769', '#F4D36F'],
        ['matcha-green', 'Matcha Green', '#AED581', '#AED581', '#AFD288'],
        ['ocean-mist', 'Ocean Mist', '#4DB6AC', '#6EC4BC', '#70CAC0'],
        ['crystal-cyan', 'Crystal Cyan', '#4DD0E1', '#52D0E0', '#6CD7E5'],
        ['twilight-blue', 'Twilight Blue', '#7986CB', '#7986CB', '#A5B4FC'],
        ['periwinkle-sky', 'Periwinkle Sky', '#9FA8DA', '#9FA8DA', '#BAC4F7'],
        ['cocoa-bean', 'Cocoa Bean', '#8D6E63', '#BD8875', '#C2A195'],
        ['desert-sand', 'Desert Sand', '#BCAAA4', '#CCA294', '#CAB8B2']
      ].map(([id, name, light, current, proposed]) => ({ id, name, light, current, proposed }));
      const byId = new Map(colors.map(color => [color.id, color]));
      const themeNames = { light: 'Light', current: 'Current dark', proposed: 'Proposed dark' };
      const defaultState = {
        selectedId: 'royal-indigo', layout: 'list', surfaceLightness: .255,
        surfaceChroma: 1, inspectorOpen: false
      };
      const state = { ...defaultState };
      const details = root.querySelector('[data-token-details]');
      const selectionButtons = new Map();
      const previewCards = new Map();

      function readSaved(snapshot) {
        const saved = snapshot?.privateContent;
        if (!saved || saved.version !== 1) return;
        if (byId.has(saved.selectedId)) state.selectedId = saved.selectedId;
        if (['list', 'pinned'].includes(saved.layout)) state.layout = saved.layout;
        if (Number.isFinite(saved.surfaceLightness)) state.surfaceLightness = Math.max(.23, Math.min(.30, saved.surfaceLightness));
        if (Number.isFinite(saved.surfaceChroma)) state.surfaceChroma = Math.max(.4, Math.min(1.4, saved.surfaceChroma));
        if (typeof saved.inspectorOpen === 'boolean') state.inspectorOpen = saved.inspectorOpen;
      }
      readSaved(window.openai?.widgetState);

      function save() {
        if (!window.openai?.setWidgetState) return;
        const color = byId.get(state.selectedId);
        Promise.resolve(window.openai.setWidgetState({
          modelContent: {
            folderColor: color.name, colorId: `folder/${color.id}`, cardStyle: state.layout,
            lightAccent: color.light, currentDarkAccent: color.current, proposedDarkAccent: color.proposed,
            proposedSurfaceLightness: state.surfaceLightness, proposedSurfaceChroma: state.surfaceChroma
          },
          privateContent: { version: 1, ...state }
        })).catch(() => {});
      }

      const parse = hex => [1, 3, 5].map(i => parseInt(hex.slice(i, i + 2), 16));
      const toHex = rgb => '#' + rgb.map(v => Math.round(Math.max(0, Math.min(255, v))).toString(16).padStart(2, '0')).join('').toUpperCase();
      const mix = (front, back, alpha) => front.map((v, i) => v * alpha + back[i] * (1 - alpha));
      const linear = v => { const s = v / 255; return s <= .04045 ? s / 12.92 : ((s + .055) / 1.055) ** 2.4; };
      const luminance = rgb => rgb.map(linear).reduce((sum, v, i) => sum + v * [.2126, .7152, .0722][i], 0);
      const contrast = (front, back) => {
        const a = luminance(front), b = luminance(back);
        return (Math.max(a, b) + .05) / (Math.min(a, b) + .05);
      };
      function toLch(hex) {
        const [r, g, b] = parse(hex).map(linear);
        const l = Math.cbrt(.4122214708 * r + .5363325363 * g + .0514459929 * b);
        const m = Math.cbrt(.2119034982 * r + .6806995451 * g + .1073969566 * b);
        const s = Math.cbrt(.0883024619 * r + .2817188376 * g + .6299787005 * b);
        const a = 1.9779984951 * l - 2.4285922050 * m + .4505937099 * s;
        const bb = .0259040371 * l + .7827717662 * m - .8086757660 * s;
        return { L: .2104542553 * l + .7936177850 * m - .0040720468 * s, C: Math.hypot(a, bb), h: Math.atan2(bb, a) };
      }
      function fromLch(L, chroma, h) {
        // Reduce chroma at the same hue/lightness until the color fits sRGB.
        let rgb, C = chroma;
        for (let n = 0; n < 96; n++) {
          const a = C * Math.cos(h), b = C * Math.sin(h);
          const l = (L + .3963377774 * a + .2158037573 * b) ** 3;
          const m = (L - .1055613458 * a - .0638541728 * b) ** 3;
          const s = (L - .0894841775 * a - 1.291485548 * b) ** 3;
          rgb = [4.0767416621 * l - 3.3077115913 * m + .2309699292 * s,
            -1.2684380046 * l + 2.6097574011 * m - .3413193965 * s,
            -.0041960863 * l - .7034186147 * m + 1.707614701 * s];
          if (rgb.every(v => v >= 0 && v <= 1)) break;
          C *= .97;
        }
        return parse(toHex(rgb.map(v => 255 * (v <= .0031308 ? 12.92 * v : 1.055 * v ** (1 / 2.4) - .055))));
      }

      function roles(color, theme, layout = state.layout) {
        const isLight = theme === 'light', pinned = layout === 'pinned';
        const bg = parse(isLight ? '#FDFBF9' : '#1A120E');
        const text = parse(isLight ? '#171717' : '#F0DFD8');
        const accent = parse(color[theme]);
        let card, box, border, count, gear;
        if (theme === 'proposed') {
          const { C, h } = toLch(color.light);
          const chroma = state.surfaceChroma;
          const cardL = state.surfaceLightness + (pinned ? .028 : 0);
          card = fromLch(cardL, Math.min(C * .22, .026) * chroma, h);
          box = fromLch(state.surfaceLightness + .06, Math.min(C * .38, .045) * chroma, h);
          border = fromLch(pinned ? .415 : .37, Math.min(C * .30, .040) * chroma, h);
          count = parse('#CDBEB6');
          gear = parse('#B9AAA2');
        } else {
          card = mix(accent, bg, pinned ? (isLight ? .12 : .22) : (isLight ? .08 : .16));
          box = mix(accent, card, isLight ? .15 : .25);
          border = mix(accent, card, pinned ? (isLight ? .40 : .55) : (isLight ? .20 : .35));
          count = pinned ? mix(text, card, .60) : mix(accent, card, .80);
          gear = pinned ? mix(accent, card, .60) : mix(parse(isLight ? '#775847' : '#E6BEAB'), card, .60);
          // Use the same opaque, 8-bit values in the cards and contrast math.
          card = parse(toHex(card)); box = parse(toHex(box)); border = parse(toHex(border));
          count = parse(toHex(count)); gear = parse(toHex(gear));
        }
        return {
          bg, text, accent, card, box, border, count, gear,
          iconContrast: contrast(accent, pinned ? card : box),
          countContrast: contrast(count, card), nameContrast: contrast(text, card)
        };
      }

      const samples = [
        { name: 'Research', count: 12, color: null },
        { name: 'Personal', count: 8, color: 'coral-rose' },
        { name: 'Reading', count: 24, color: 'matcha-green' },
        { name: 'Ideas', count: 6, color: 'soft-gold' }
      ];

      function cardMarkup(sample, pinned) {
        const icon = '<i data-lucide="folder" aria-hidden="true"></i>';
        const gear = '<span class="c-gear" aria-hidden="true"><i data-lucide="settings" aria-hidden="true"></i></span>';
        const copy = `<div class="c-folderCopy"><span class="c-folderName">${sample.name}${pinned ? '<i data-lucide="pin" aria-hidden="true"></i>' : ''}</span><span class="c-count">${sample.count} items</span></div>`;
        return pinned ? `<div class="c-pinnedTop">${icon}${gear}</div>${copy}` : `<span class="c-iconBox">${icon}</span>${copy}${gear}`;
      }
      function setRoles(card, r) {
        for (const [property, rgb] of Object.entries({
          '--c-folderAccent': r.accent, '--c-folderBg': r.card, '--c-iconBg': r.box,
          '--c-folderBorder': r.border, '--c-folderCount': r.count, '--c-folderGear': r.gear
        })) card.style.setProperty(property, toHex(rgb));
      }
      for (const themeElement of root.querySelectorAll('.c-theme')) {
        const cards = [];
        for (const sample of samples) {
          const card = document.createElement('article');
          card.className = 'c-folder';
          themeElement.querySelector('.c-folders').append(card);
          cards.push(card);
        }
        previewCards.set(themeElement.dataset.theme, cards);
      }
      for (const color of colors) {
        const button = document.createElement('button');
        button.type = 'button'; button.className = 'c-paletteButton cursor-interaction';
        button.dataset.colorId = color.id;
        button.style.setProperty('--c-lightColor', color.light);
        button.style.setProperty('--c-darkColor', color.proposed);
        button.innerHTML = `<span class="c-paletteSwatch" aria-hidden="true"></span><span>${color.name}</span>`;
        button.setAttribute('aria-label', `${color.name}, light ${color.light}, proposed dark ${color.proposed}`);
        button.addEventListener('click', () => {
          state.selectedId = color.id; render(); save(); announce();
        });
        root.querySelector('.c-palette').append(button);
        selectionButtons.set(color.id, button);
      }
      function announce() {
        const color = byId.get(state.selectedId), r = roles(color, 'proposed');
        root.querySelector('[data-announcement]').textContent = `${color.name}, ${state.layout} cards. Proposed dark icon contrast ${r.iconContrast.toFixed(2)} to 1. Item count contrast ${r.countContrast.toFixed(2)} to 1.`;
      }
      function render() {
        const selected = byId.get(state.selectedId), pinned = state.layout === 'pinned';
        root.dataset.layout = state.layout;
        root.querySelector('[data-selected-name]').textContent = selected.name;
        root.querySelector('[data-selected-id]').textContent = `folder/${selected.id}`;
        for (const button of root.querySelectorAll('[data-layout-choice]')) button.setAttribute('aria-pressed', String(button.dataset.layoutChoice === state.layout));
        for (const [id, button] of selectionButtons) button.setAttribute('aria-pressed', String(id === state.selectedId));
        const tokenGroups = [];
        for (const themeElement of root.querySelectorAll('.c-theme')) {
          const theme = themeElement.dataset.theme;
          const cards = previewCards.get(theme);
          samples.forEach((sample, i) => {
            const color = i === 0 ? selected : byId.get(sample.color);
            const r = roles(color, theme);
            if (cards[i].dataset.layout !== state.layout) {
              cards[i].innerHTML = cardMarkup(sample, pinned); cards[i].dataset.layout = state.layout;
            }
            setRoles(cards[i], r);
            cards[i].dataset.colorId = color.id;
            cards[i].setAttribute('aria-label', `${sample.name}, ${sample.count} items, ${color.name}${pinned ? ', pinned' : ''}`);
          });
          const r = roles(selected, theme);
          themeElement.querySelector('[data-accent-hex]').textContent = selected[theme];
          themeElement.querySelector('.c-measures').innerHTML = `<div><dt>Icon · target 3:1</dt><dd>${r.iconContrast.toFixed(2)}:1</dd></div><div><dt>Item count · target 4.5:1</dt><dd>${r.countContrast.toFixed(2)}:1</dd></div>`;
          const tokens = [['Icon accent', r.accent], ['Card surface', r.card], ...(!pinned ? [['Icon box', r.box]] : []), ['Card border', r.border], ['Folder label', r.text], ['Item count', r.count]];
          tokenGroups.push(`<section class="c-tokenGroup"><h3>${themeNames[theme]}</h3><dl>${tokens.map(([name, rgb]) => `<div class="c-tokenRow"><dt>${name}</dt><dd><span class="c-tokenSwatch" style="--c-tokenColor:${toHex(rgb)}" aria-hidden="true"></span>${toHex(rgb)}</dd></div>`).join('')}</dl></section>`);
        }
        root.querySelector('.c-tokens').innerHTML = tokenGroups.join('');
        details.open = state.inspectorOpen;
        if (globalThis.lucide) globalThis.lucide.createIcons({ attrs: { width: 20, height: 20 } });
      }
      for (const button of root.querySelectorAll('[data-layout-choice]')) button.addEventListener('click', () => {
        state.layout = button.dataset.layoutChoice; render(); save(); announce();
      });
      details.addEventListener('toggle', () => {
        if (state.inspectorOpen === details.open) return;
        state.inspectorOpen = details.open; save();
      });
      window.addEventListener('openai:set_globals', event => {
        if (!event.detail?.globals?.widgetState) return;
        readSaved(event.detail.globals.widgetState); render();
      });
      render();
      if (globalThis.Tweak) {
        const tweak = new Tweak({
          container: root.querySelector('[data-theme="proposed"]'),
          onChange: () => { render(); save(); announce(); }
        });
        tweak.addSlider(state, 'surfaceLightness', { label: 'Dark surface lightness', min: .23, max: .30, step: .005, reference: 'folder.dark.surface.L' });
        tweak.addSlider(state, 'surfaceChroma', { label: 'Color in dark surfaces', min: .4, max: 1.4, step: .1, reference: 'folder.dark.surface.chroma' });
      }
    })();
  </script>
</section>
